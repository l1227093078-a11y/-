:root{color-scheme:light;--green:#00b777;--ink:#38373c;--background:#fbf8fe}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#edf3ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,a{font:inherit;touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #00874d;outline-offset:4px}svg{display:block;flex:none;pointer-events:none}
.stage{min-height:100svh;display:flex;align-items:flex-start;justify-content:center;padding:36px 20px 24px}
.phone{width:414px;height:894px;flex:none;background:var(--background);border:7px solid #fff;border-radius:39px;box-shadow:0 0 0 1px #d8e3dc,0 22px 55px #28483112;position:relative;display:flex;flex-direction:column;overflow:clip;isolation:isolate}
.statusbar{height:34px;flex:none;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:5px 22px 0;font-size:13px;font-weight:600;letter-spacing:.2px;color:#25392d}.status-icons{display:flex;gap:5px;align-items:center}.status-icons svg{width:12px;height:12px;stroke-width:1.7}
.report-nav{height:48px;flex:none;position:relative;display:flex;align-items:center;padding:0 14px;background:#fff}
.report-nav h1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;font-size:20px;line-height:1.5;font-weight:650;letter-spacing:.5px;white-space:nowrap}
.report-back{width:40px;height:44px;margin-left:-5px;border:0;padding:7px;background:none;color:#38373c;display:flex;align-items:center;justify-content:center}.report-back svg{width:26px;height:26px;stroke-width:1.7}
.report-content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 17px 36px;scrollbar-width:none}.report-content::-webkit-scrollbar{width:0}
.report-list{display:flex;flex-direction:column;gap:12px}
.report-row{display:flex;align-items:center;gap:12px;min-height:64px;width:100%;padding:10px 12px;border:0;border-radius:9px;background:#fff;text-align:left;text-decoration:none;color:#68676c;transition:background .15s,transform .15s}
.report-icon{width:43px;height:43px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--green);color:#fff;box-shadow:-3px 2px 0 #00b77719,3px -2px 0 #00b77715}
.report-icon svg{width:29px;height:29px;stroke-width:1.85}.report-name{flex:1;min-width:0;font-size:17px;line-height:1.5;font-weight:500;letter-spacing:.2px;overflow-wrap:anywhere}.report-chevron{color:#77757d}.report-chevron svg{width:18px;height:18px;stroke-width:1.7}
.report-row:active{background:#f1fbf6;transform:scale(.992)}
.home-indicator{position:absolute;bottom:0;left:0;right:0;height:20px;background:#fbf8fef5;display:flex;justify-content:center;align-items:center;pointer-events:none}.home-indicator span{width:108px;height:4px;border-radius:4px;background:#1d3b29}
.report-toast{position:absolute;z-index:5;left:50%;bottom:48px;transform:translate(-50%,8px);max-width:calc(100% - 32px);padding:11px 16px;border-radius:10px;color:#fff;background:#343239eb;line-height:1.6;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap}.report-toast.show{opacity:1;transform:translate(-50%,0)}
@media(hover:hover){.report-row:hover{background:#f1fbf6}.report-back:hover{color:#00874d}}
@media(max-width:460px){body{background:var(--background)}.stage{padding:0;min-height:100dvh}.phone{width:100%;height:100dvh;min-height:560px;border:0;border-radius:0;box-shadow:none}.home-indicator{height:max(20px,env(safe-area-inset-bottom))}.report-content{padding-bottom:max(36px,calc(env(safe-area-inset-bottom) + 20px))}}
@media(max-width:360px){.report-content{padding:14px 14px 32px}.report-list{gap:10px}.report-row{gap:10px;min-height:62px;padding:9px 10px}.report-icon{width:40px;height:40px;border-radius:14px}.report-icon svg{width:27px;height:27px}.report-name{font-size:15px;letter-spacing:0}.report-nav h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){.report-row,.report-toast{transition:none}}

document.querySelector('#reportsBack').onclick=()=>window.history.back();
