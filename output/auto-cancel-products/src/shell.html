<!-- Summary icons: custom green 3D assets generated for this prototype. -->
<body><main class="stage"><div class="phone" id="phone">
<div class="app-content" id="appContent">
__STATUS__
<header class="nav"><a class="icon-button" id="navBack" href="./" aria-label="返回经营报表" data-icon="chevron-left"></a><h1 id="navTitle">超时自动退单商品统计</h1><button class="info-button" id="infoButton" type="button">说明</button></header>

<div class="filter-row"><span class="filter-label">统计日期</span><button type="button" class="filter-control" id="dateButton" aria-haspopup="dialog"><span class="date-value"><span data-icon="calendar"></span><span id="dateLabel"></span></span><span data-icon="chevron-down"></span></button></div>

<div class="content">

<h2 class="market-list-heading">市场明细</h2>
<div id="resultList" aria-live="polite"></div><p class="list-end" id="listEnd"></p>
</div></div>
<section id="detailView" aria-label="市场门店数据" hidden>
<div class="detail-tools"><div class="detail-date"><span data-icon="calendar"></span><span id="detailDate"></span></div><p class="detail-counts" id="detailCounts"></p>

</div><div class="detail-content"><div id="detailList" aria-live="polite"></div><p class="list-end" id="detailEnd"></p></div>
</section></div>
</div>

<div class="home-indicator" aria-hidden="true"><span></span></div>
</div></main>
