<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8f5"><title>超时自动退单商品</title><style>__STYLE__</style></head>
<body><main class="stage"><div class="phone" id="phone">
<div class="app-content" id="appContent">
__STATUS__
<header class="nav"><a class="icon-button" href="../reports.html" aria-label="返回经营报表" data-icon="chevron-left"></a><h1>超时自动退单商品</h1><button class="info-button" id="infoButton" type="button">说明</button></header>
<div class="page-scroll" id="pageScroll">
<section class="filters" aria-label="筛选条件">
<div class="filter-row"><span class="filter-label">关联组织</span><button type="button" class="filter-control" id="orgButton" aria-haspopup="dialog"><span id="orgLabel">全部组织</span><span data-icon="chevron-down"></span></button></div>
<div class="filter-row"><span class="filter-label">统计日期</span><button type="button" class="filter-control" id="dateButton" aria-haspopup="dialog"><span class="date-value"><span data-icon="calendar"></span><span id="dateLabel"></span></span><span data-icon="chevron-down"></span></button></div>
</section>
<div class="content">
<section class="summary" aria-label="当前筛选汇总"><div class="summary-heading"><span>商品种类数合计</span><span class="demo-tag">示例数据</span></div><div class="summary-number"><strong id="totalProducts">24</strong><span>种</span></div><div class="summary-meta"><span>涉及门店 <b id="totalStores">12</b> 家</span><span>跨门店去重 <b id="distinctProducts">10</b> 种</span></div></section>
<div class="list-heading"><h2>商品明细</h2><span id="resultCount"></span></div>
<div class="search-box"><span data-icon="search"></span><input id="searchInput" type="search" placeholder="搜索商品名称或编码" aria-label="搜索商品名称或编码"><button type="button" id="clearSearch" aria-label="清空搜索" hidden data-icon="x"></button></div>
<div id="resultList" aria-live="polite"></div><p class="list-end" id="listEnd"></p>
</div></div>
</div>
<div id="backdrop" class="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><div class="sheet-grip"></div><header class="sheet-header"><h2 id="sheetTitle"></h2><button type="button" id="closeSheet" class="close-button" aria-label="关闭" data-icon="x"></button></header><div class="sheet-body" id="sheetBody"></div><footer class="sheet-footer" id="sheetFooter"><span id="selectionCount" role="status" hidden></span><button type="button" id="resetSheet" class="secondary">重置</button><button type="button" id="confirmSheet" class="primary">确定</button></footer></section>
<div class="home-indicator" aria-hidden="true"><span></span></div>
</div></main>
<script>const ICONS=__ICONS__;const DATA=__DATA__;
__APP__</script></body></html>
