  var PRODUCT_ICONS = {"g1": "<img alt=\"\" aria-hidden=\"true\" src=\"data:image/svg+xml;base64,PHN2ZwogIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIKICB3aWR0aD0iMjQiCiAgaGVpZ2h0PSIyNCIKICB2aWV3Qm94PSIwIDAgMjQgMjQiCiAgZmlsbD0ibm9uZSIKICBzdHJva2U9IiMzOTczNjUiCiAgc3Ryb2tlLXdpZHRoPSIyIgogIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIKICBzdHJva2UtbGluZWpvaW49InJvdW5kIgogIGNsYXNzPSJpY29uIGljb24tdGFibGVyIGljb25zLXRhYmxlci1vdXRsaW5lIGljb24tdGFibGVyLXNob2UiCj4KICA8cGF0aCBzdHJva2U9Im5vbmUiIGQ9Ik0wIDBoMjR2MjRIMHoiIGZpbGw9Im5vbmUiLz4KICA8cGF0aCBkPSJNNCA2aDUuNDI2YTEgMSAwIDAgMSAuODYzIC40OTZsMS4wNjQgMS44MjNhMyAzIDAgMCAwIDEuODk2IDEuNDA3bDQuNjc3IDEuMTE0YTQgNCAwIDAgMSAzLjA3NCAzLjg5djIuMjdhMSAxIDAgMCAxIC0xIDFoLTE2YTEgMSAwIDAgMSAtMSAtMXYtMTBhMSAxIDAgMCAxIDEgLTF6IiAvPgogIDxwYXRoIGQ9Ik0xNCAxM2wxIC0yIiAvPgogIDxwYXRoIGQ9Ik04IDE4di0xYTQgNCAwIDAgMCAtNCAtNGgtMSIgLz4KICA8cGF0aCBkPSJNMTAgMTJsMS41IC0zIiAvPgo8L3N2Zz4=\">", "g2": "<img alt=\"\" aria-hidden=\"true\" src=\"data:image/svg+xml;base64,PHN2ZwogIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIKICB3aWR0aD0iMjQiCiAgaGVpZ2h0PSIyNCIKICB2aWV3Qm94PSIwIDAgMjQgMjQiCiAgZmlsbD0ibm9uZSIKICBzdHJva2U9IiMzOTczNjUiCiAgc3Ryb2tlLXdpZHRoPSIyIgogIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIKICBzdHJva2UtbGluZWpvaW49InJvdW5kIgogIGNsYXNzPSJpY29uIGljb24tdGFibGVyIGljb25zLXRhYmxlci1vdXRsaW5lIGljb24tdGFibGVyLXBsYW50LTIiCj4KICA8cGF0aCBzdHJva2U9Im5vbmUiIGQ9Ik0wIDBoMjR2MjRIMHoiIGZpbGw9Im5vbmUiLz4KICA8cGF0aCBkPSJNMiA5YTEwIDEwIDAgMSAwIDIwIDAiIC8+CiAgPHBhdGggZD0iTTEyIDE5YTEwIDEwIDAgMCAxIDEwIC0xMCIgLz4KICA8cGF0aCBkPSJNMiA5YTEwIDEwIDAgMCAxIDEwIDEwIiAvPgogIDxwYXRoIGQ9Ik0xMiA0YTkuNyA5LjcgMCAwIDEgMi45OSA3LjUiIC8+CiAgPHBhdGggZD0iTTkuMDEgMTEuNWE5LjcgOS43IDAgMCAxIDIuOTkgLTcuNSIgLz4KPC9zdmc+\">"};
  /* ========== Mock 数据 ========== */
  /* 优惠券是订单级资产，不属于单个商品 */
  var ORDER = {
    no:'DD202609110088',
    coupon:'优惠券(满0元减1)',
    gift:'优惠券(满0元减1)'
  };

  var GOODS = [
    { id:'g1', name:'卡其色皮靴', spec:'（卡其色）', sku:'BZ00000000', totalQty:2,
      price:0.01, paid:0.02, unitPoint:30 },
    { id:'g2', name:'云南牛奶芋头', spec:'5斤', sku:'BZ00000001', totalQty:2,
      price:0.01, paid:0.02, unitPoint:20, noUn:true, withStock:true }
  ];

  /* 每个商品拆成「未提货 / 已提货」两个包；noUn 的商品只有已提货，withStock 的已提货多一行返还库存 */
  function packsOf(g){
    var ps = [];
    if(!g.noUn){
      ps.push({ id:g.id+'-un',  g:g, key:'un',  label:'未提货', cls:'un',  max:1, auto:true,
                maxAmount:round2(g.price*1), maxPoint:g.unitPoint });
    }
    ps.push({ id:g.id+'-got', g:g, key:'got', label:'已提货', cls:'got', max:1, auto:false,
              maxAmount:round2(g.price*1), maxPoint:g.unitPoint,
              stock:!!g.withStock, stockMax:1 });
    return ps;
  }

  var state = { checked:{}, qty:{}, amount:{}, point:{}, stock:{}, open:{} };

  GOODS.forEach(function(g){
    packsOf(g).forEach(function(p){
      state.checked[p.id] = true;
      state.qty[p.id] = p.max;
      if(!p.auto){
        state.amount[p.id] = p.maxAmount;   // 已提货：可自定义，初值取售价
        state.point[p.id]  = 0;             // 已提货：积分默认 0，手填
        if(p.stock) state.stock[p.id] = 0;  // 返还库存默认 0
      }
    });
  });

  function findPack(pid){
    for(var i=0;i<GOODS.length;i++){
      var ps = packsOf(GOODS[i]);
      for(var j=0;j<ps.length;j++){
        if(ps[j].id === pid) return ps[j];
      }
    }
    return null;
  }

  /* ========== 计算 ========== */
  function amountOf(p){
    if(p.auto){
      var q = state.qty[p.id] || 0;
      return round2(Math.min(p.g.price * q, p.maxAmount));
    }
    var v = state.amount[p.id];
    return round2(typeof v === 'number' ? v : 0);
  }
  function pointOf(p){
    if(p.auto){
      return Math.round(p.g.unitPoint * (state.qty[p.id] || 0));
    }
    return state.point[p.id] || 0;
  }

  function totals(){
    var t = { amt:0, pts:0, qty:0, maxQty:0, paid:0, n:0 };
    GOODS.forEach(function(g){
      t.paid = round2(t.paid + g.paid);
      packsOf(g).forEach(function(p){
        t.maxQty += p.max;
        if(!state.checked[p.id]) return;
        t.n += 1;
        t.qty += state.qty[p.id] || 0;
        t.amt += amountOf(p);
        t.pts += pointOf(p);
      });
    });
    t.amt = round2(t.amt);
    return t;
  }

  /* ========== 渲染 ========== */
  /* 状态块：块头条（勾选/标签/权限）+ 行式字段（退货数量、退款金额、退款幸福分） */
  function packHTML(p){
    var on  = !!state.checked[p.id];
    var q   = state.qty[p.id] || 0;
    var amt = amountOf(p);
    var pt  = pointOf(p);

    var head =

        '<span class="stt '+p.cls+'">'+p.label+'</span>' +
        '<span class="pnote">'+(p.auto ? '自动计算' : '可自定义')+'</span>' +
      '</div>';

    var rowQty =
      '<div class="frow">' +
        '<div class="fcol">' +
          '<span class="fl">退货数量</span>' +
          '<span class="hint" id="hint-q-'+p.id+'">最多'+p.max+'份'+(p.auto ? '' : '，填0仅退款')+'</span>' +
        '</div>' +
        '<div class="fc">' +
          '<div class="step">' +
            '<button type="button" aria-label="减少退货数量" data-step="minus" data-id="'+p.id+'"'+dis+'>−</button>' +
            '<span class="sline"></span>' +
            '<input type="text" inputmode="numeric" aria-label="退货数量" data-qty="'+p.id+'" value="'+q+'"'+dis+'>' +
            '<span class="sline"></span>' +
            '<button type="button" aria-label="增加退货数量" data-step="plus" data-id="'+p.id+'"'+dis+'>+</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var rowAmt, rowPt;
    if(p.auto){
      rowAmt =
        '<div class="frow">' +
          '<div class="fcol"><span class="fl">退款金额</span></div>' +
          '<div class="fc">' +
            '<div class="ro"><span class="num" id="amt-'+p.id+'">'+money(amt)+'</span><i class="lock">'+ICON_LOCK+'</i></div>' +
          '</div>' +
        '</div>';
      rowPt =
        '<div class="frow">' +
          '<div class="fcol"><span class="fl">退款幸福分</span></div>' +
          '<div class="fc">' +
            '<div class="ro"><span class="num" id="pt-'+p.id+'">'+pt+'</span><i class="lock">'+ICON_LOCK+'</i></div>' +
          '</div>' +
        '</div>';
    } else {
      rowAmt =
        '<div class="frow">' +
          '<div class="fcol">' +
            '<span class="fl">退款金额</span>' +
            '<span class="hint" id="hint-amt-'+p.id+'">上限 '+money(p.maxAmount)+'</span>' +
          '</div>' +
          '<div class="fc">' +
            '<div class="money" id="mw-amt-'+p.id+'"><span class="cur">¥</span><input type="text" inputmode="decimal" aria-label="退款金额" data-amt="'+p.id+'" value="'+amt.toFixed(2)+'"'+dis+'></div>' +
          '</div>' +
        '</div>';
      rowPt =
        '<div class="frow">' +
          '<div class="fcol">' +
            '<span class="fl">退款幸福分</span>' +
            '<span class="hint" id="hint-pt-'+p.id+'">上限 '+p.maxPoint+' 分</span>' +
          '</div>' +
          '<div class="fc">' +
            '<div class="money" id="mw-pt-'+p.id+'"><input type="text" inputmode="numeric" aria-label="退款幸福分" data-pt="'+p.id+'" value="'+pt+'"'+dis+'></div>' +
          '</div>' +
        '</div>';
    }

    var rowStock = '';
    if(p.stock){
      var sv = state.stock[p.id] || 0;
      rowStock =
        '<div class="frow">' +
          '<div class="fcol">' +
            '<span class="fl">返还库存</span>' +
            '<span class="hint" id="hint-stk-'+p.id+'">未分拣库存，最多可退'+p.stockMax+'斤</span>' +
          '</div>' +
          '<div class="fc">' +
            '<div class="money stk" id="mw-stk-'+p.id+'"><input type="text" inputmode="numeric" aria-label="返还库存" data-stk="'+p.id+'" value="'+sv+'"'+dis+'><span class="unit">斤</span></div>' +
          '</div>' +
        '</div>';
    }

    return '<div class="prow '+p.cls+(on?'':' off')+'">' + head +
      '<div class="pack"><div class="pack-bd">' + rowQty + rowAmt + rowPt + rowStock + '</div></div>' +
    '</div>';
  }

  function cardHTML(g){
    var ps = packsOf(g);
    var selAmt = 0, selQty = 0;
    ps.forEach(function(p){
      if(state.checked[p.id]){ selAmt += amountOf(p); selQty += (state.qty[p.id] || 0); }
    });
    var TAGS = { un:['未提货','tag un'], got:['已提货','tag got'] };
    var tagsHtml = '';
    ps.forEach(function(p){
      var t = TAGS[p.key];
      if(t) tagsHtml += '<span class="'+t[1]+'">'+t[0]+'<b>'+p.max+'</b></span>';
    });

    var open = !!state.open[g.id];
    var rows = ps.map(packHTML).join('');

    return '<section class="card">' +
      '<div class="card-hd">' +
        '<div class="thumb '+g.id+'">'+PRODUCT_ICONS[g.id]+'</div>' +
        '<div class="info">' +
          '<div class="pname">'+g.name+'</div>' +
          '<div class="pmeta">规格：'+g.spec+'</div><div class="sku">SKU '+g.sku+'</div>' +
          '<div class="pricebar">' +
            '<div class="pb"><span class="k">单价</span><b>'+money(g.price)+'</b></div>' +
            '<div class="pb"><span class="k">支付金额</span><b>'+money(g.paid)+'</b></div>' +
          '</div>' +
        '</div>' +
        '<button class="edit-btn'+(open?' on':'')+'" type="button" aria-expanded="'+open+'" data-edit="'+g.id+'">' +
          '<span class="et">'+(open?'收起':'编辑退款')+'</span>' + ICON_CARET +
        '</button>' +
      '</div>' +
      '<div class="refund-row">' +
        '<span class="rsent">本次退货 <b class="q" id="gqty-'+g.id+'">'+selQty+'</b> 件，退款金额：<b class="rv" id="gamt-'+g.id+'">'+money(selAmt)+'</b></span>' +
        '<span class="tags">' + tagsHtml + '</span>' +
      '</div>' +
      '<div class="packs'+(open?' on':'')+'">' + rows + '</div>' +
    '</section>';
  }

  function render(){
    document.getElementById('list').innerHTML = GOODS.map(cardHTML).join('');
    refreshAll();
    applyAlerts();   // 重渲染会重置提示文案，需按当前值回填超限态
  }

  /* 按当前输入值回填「超限」提示与红框，避免重渲染后红色告警丢失 */
  function applyAlerts(){
    GOODS.forEach(function(g){
      packsOf(g).forEach(function(p){
        if(p.auto) return;
        var a = state.amount[p.id] || 0;
        var overA = a > p.maxAmount + 0.001;
        var ha = document.getElementById('hint-amt-'+p.id);
        var wa = document.getElementById('mw-amt-'+p.id);
        if(ha){ ha.classList.toggle('alert', overA); ha.textContent = (overA ? '已超出上限 ' : '上限 ') + money(p.maxAmount); }
        if(wa) wa.classList.toggle('err', overA);

        var pn = state.point[p.id] || 0;
        var overP = pn > p.maxPoint;
        var hp = document.getElementById('hint-pt-'+p.id);
        var wp = document.getElementById('mw-pt-'+p.id);
        if(hp){ hp.classList.toggle('alert', overP); hp.textContent = (overP ? '已超出上限 ' : '上限 ') + p.maxPoint + ' 分'; }
        if(wp) wp.classList.toggle('err', overP);

        if(p.stock){
          var st = state.stock[p.id] || 0;
          var overS = st > p.stockMax;
          var hs = document.getElementById('hint-stk-'+p.id);
          var ws = document.getElementById('mw-stk-'+p.id);
          if(hs){ hs.classList.toggle('alert', overS); hs.textContent = overS ? '已超出可退库存，最多'+p.stockMax+'斤' : '未分拣库存，最多可退'+p.stockMax+'斤'; }
          if(ws) ws.classList.toggle('err', overS);
        }
      });
    });
  }

  /* 只更新数字，不重建 DOM（避免输入焦点丢失） */
  function refreshAll(){
    GOODS.forEach(function(g){
      var sum = 0, qsum = 0;
      packsOf(g).forEach(function(p){
        if(state.checked[p.id]){ sum += amountOf(p); qsum += (state.qty[p.id] || 0); }
        var a = document.getElementById('amt-'+p.id);
        if(a) a.textContent = money(amountOf(p));
        var b = document.getElementById('pt-'+p.id);
        if(b) b.textContent = pointOf(p);
      });
      var gEl = document.getElementById('gamt-'+g.id);
      if(gEl) gEl.textContent = money(sum);
      var qEl = document.getElementById('gqty-'+g.id);
      if(qEl) qEl.textContent = qsum;
    });
    updateSum();
  }

  function updateSum(){
    var t = totals();

    var sc = document.getElementById('selCount');
    if(sc) sc.textContent = t.n;
    $('#sumAmount').textContent  = money(t.amt);
    $('#sumPoint').textContent   = t.pts;
    $('#sumAmount2').textContent = money(t.amt);
    $('#sumPoint2').textContent  = t.pts;

    /* 券信息：仅展示订单券名，不再附带退还/回收状态标签 */
    var cb = $('#cpBack'), cg = $('#cpGift');

    if(t.n === 0){
      cb.textContent = '—';
      cg.textContent = '—';
    } else {
      cb.textContent = ORDER.coupon;
      cg.textContent = ORDER.gift;
    }

    $('#btnOk').disabled = t.n === 0;
  }

  /* ========== 交互 ========== */
  var toastTimer;
  function toast(msg){
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1900);
  }

  document.addEventListener('change', function(e){
    var c = e.target.closest ? e.target.closest('[data-chk]') : null;
    if(!c) return;
    state.checked[c.dataset.chk] = c.checked;
    render();
  });

  document.addEventListener('click', function(e){
    /* 展开 / 收起商品明细 */
    var eb = e.target.closest ? e.target.closest('[data-edit]') : null;
    if(eb){
      var gid = eb.dataset.edit;
      var op  = !state.open[gid];
      state.open[gid] = op;
      eb.setAttribute('aria-expanded',String(op));
      var card = eb.closest('.card');
      var box  = card ? card.querySelector('.packs') : null;
      if(box) box.classList.toggle('on', op);
      eb.classList.toggle('on', op);
      var et = eb.querySelector('.et');
      if(et) et.textContent = op ? '收起' : '编辑退款';
      return;
    }

    var b = e.target.closest ? e.target.closest('[data-step]') : null;
    if(!b || b.disabled) return;
    var pid = b.dataset.id;
    var p = findPack(pid);
    if(!p) return;
    var n = (state.qty[pid] || 0) + (b.dataset.step === 'plus' ? 1 : -1);
    n = Math.max(0, Math.min(p.max, n));
    if(n === state.qty[pid]) return;
    state.qty[pid] = n;
    var inp = document.querySelector('[data-qty="'+pid+'"]');
    if(inp) inp.value = n;
    refreshAll();
  });

  document.addEventListener('input', function(e){
    var el = e.target;

    /* 退货数量 */
    if(el.dataset && el.dataset.qty){
      var pid = el.dataset.qty;
      var p = findPack(pid);
      var raw = (el.value || '').replace(/[^\d]/g, '');
      if(raw !== el.value) el.value = raw;
      var n = parseInt(raw || '0', 10);
      if(isNaN(n)) n = 0;
      state.qty[pid] = Math.min(n, p.max);
      var h = document.getElementById('hint-q-'+pid);
      if(h) h.classList.toggle('alert', n > p.max);
      refreshAll();
      return;
    }

    /* 已提货：退款金额 */
    if(el.dataset && el.dataset.amt){
      var aid = el.dataset.amt;
      var pa = findPack(aid);
      var v = (el.value || '').replace(/[^\d.]/g, '');
      var dot = v.indexOf('.');
      if(dot > -1) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, '');
      if(v !== el.value) el.value = v;
      var num = parseFloat(v);
      if(isNaN(num)) num = 0;
      state.amount[aid] = num;
      var over = num > pa.maxAmount + 0.001;
      var ha = document.getElementById('hint-amt-'+aid);
      var wa = document.getElementById('mw-amt-'+aid);
      if(ha){ ha.classList.toggle('alert', over); ha.textContent = over ? '已超出上限 '+money(pa.maxAmount) : '上限 '+money(pa.maxAmount); }
      if(wa) wa.classList.toggle('err', over);
      refreshAll();
      return;
    }

    /* 返还库存（斤） */
    if(el.dataset && el.dataset.stk){
      var sid = el.dataset.stk;
      var pk = findPack(sid);
      var vs = (el.value || '').replace(/[^\d]/g, '');
      if(vs !== el.value) el.value = vs;
      var ns = parseInt(vs || '0', 10);
      if(isNaN(ns)) ns = 0;
      state.stock[sid] = ns;
      var hs2 = document.getElementById('hint-stk-'+sid);
      var ws2 = document.getElementById('mw-stk-'+sid);
      var overS2 = ns > pk.stockMax;
      if(hs2){ hs2.classList.toggle('alert', overS2); hs2.textContent = overS2 ? '已超出可退库存，最多'+pk.stockMax+'斤' : '未分拣库存，最多可退'+pk.stockMax+'斤'; }
      if(ws2) ws2.classList.toggle('err', overS2);
      refreshAll();
      return;
    }

    /* 已提货：退款幸福分 */
    if(el.dataset && el.dataset.pt){
      var pid2 = el.dataset.pt;
      var pp = findPack(pid2);
      var s = (el.value || '').replace(/[^\d]/g, '');
      if(s !== el.value) el.value = s;
      var pn = parseInt(s || '0', 10);
      if(isNaN(pn)) pn = 0;
      state.point[pid2] = pn;
      var hp = document.getElementById('hint-pt-'+pid2);
      var wp = document.getElementById('mw-pt-'+pid2);
      var overP = pn > pp.maxPoint;
      if(hp) { hp.classList.toggle('alert', overP); hp.textContent = overP ? '已超出上限 '+pp.maxPoint+' 分' : '上限 '+pp.maxPoint+' 分'; }
      if(wp) wp.classList.toggle('err', overP);
      refreshAll();
      return;
    }
  });

  /* 失焦修正数量 & 金额格式 */
  document.addEventListener('blur', function(e){
    var el = e.target;
    if(!el.dataset) return;

    if(el.dataset.qty){
      var p = findPack(el.dataset.qty);
      var n = parseInt(el.value || '0', 10);
      if(isNaN(n) || n < 0) n = 0;
      if(n > p.max) n = p.max;
      el.value = n;
      state.qty[el.dataset.qty] = n;
      var h = document.getElementById('hint-q-'+el.dataset.qty);
      if(h) h.classList.remove('alert');
      refreshAll();
    }
    if(el.dataset.amt){
      var v = parseFloat(el.value);
      if(isNaN(v) || v < 0) v = 0;
      el.value = round2(v).toFixed(2);
      state.amount[el.dataset.amt] = round2(v);
      refreshAll();
    }
    if(el.dataset.pt){
      var pn = parseInt(el.value || '0', 10);
      if(isNaN(pn) || pn < 0) pn = 0;
      el.value = pn;
      state.point[el.dataset.pt] = pn;
      refreshAll();
    }
    if(el.dataset.stk){
      var ps2 = findPack(el.dataset.stk);
      var n2 = parseInt(el.value || '0', 10);
      if(isNaN(n2) || n2 < 0) n2 = 0;
      if(n2 > ps2.stockMax) n2 = ps2.stockMax;
      el.value = n2;
      state.stock[el.dataset.stk] = n2;
      var h2 = document.getElementById('hint-stk-'+el.dataset.stk);
      if(h2) h2.classList.remove('alert');
      refreshAll();
    }
  }, true);

  /* 全选 / 取消 */
  $('#btnAll').addEventListener('click', function(){
    GOODS.forEach(function(g){ packsOf(g).forEach(function(p){ state.checked[p.id] = true; }); });
    render();
  });
  $('#btnNone').addEventListener('click', function(){
    GOODS.forEach(function(g){ packsOf(g).forEach(function(p){ state.checked[p.id] = false; }); });
    render();
  });

  /* 提交 */
  $('#btnOk').addEventListener('click', function(){
    var t = totals();
    if(t.n === 0){ toast('请至少选择一项退款明细'); return; }

    /* 已提货金额上限校验 */
    var bad = null;
    GOODS.forEach(function(g){
      packsOf(g).forEach(function(p){
        if(p.auto || !state.checked[p.id]) return;
        if((state.amount[p.id] || 0) > p.maxAmount + 0.001 || (state.point[p.id] || 0)>p.maxPoint || (p.stock && (state.stock[p.id]||0)>p.stockMax)) bad = p;
      });
    });
    if(bad){
      var wa = document.getElementById('mw-amt-'+bad.id);
      if(wa) wa.classList.add('err');
      state.open[bad.g.id]=true; render(); document.getElementById('mw-amt-'+bad.id).closest('.prow').scrollIntoView({block:'center',behavior:'smooth'}); toast('请检查退款金额、幸福分或库存，不能超出可退上限');
      return;
    }

    showConfirm(t);
  });

  $('#btnClose').addEventListener('click', function(){
    showExit();
  });

  var dialog=$('#confirmDialog'), previousFocus;
  function openDialog(html){if(!dialog.open)previousFocus=document.activeElement;$('#dialogContent').innerHTML=html;var heading=dialog.querySelector('h2');heading.id='dialogTitle';dialog.setAttribute('aria-labelledby','dialogTitle');if(!dialog.open)dialog.showModal();}
  function closeDialog(){dialog.close();if(previousFocus)previousFocus.focus();}
  function showConfirm(t){
    var names=[];GOODS.forEach(function(g){packsOf(g).forEach(function(p){if(state.checked[p.id])names.push('<div class="confirm-item"><span>'+g.name+' · '+p.label+'</span><b>'+money(amountOf(p))+'</b></div>');});});
    openDialog('<h2>确认本次退款</h2><p class="dialog-sub">请核对以下退款信息</p><div class="confirm-total"><span>退款金额</span><strong>'+money(t.amt)+'</strong><p>退货 '+t.qty+' 件 · 退还幸福分 '+t.pts+' 分</p></div>'+names.join('')+'<p class="dialog-note">确认后将提交退款审核，退款按原支付渠道退回。</p><div class="dialog-actions"><button data-dialog="cancel">再核对一下</button><button class="primary" data-dialog="submit">确认提交</button></div>');
  }
  function showExit(){openDialog('<h2>退出退款编辑？</h2><p class="dialog-sub">退出将重置本次填写的退款内容。</p><div class="dialog-actions"><button data-dialog="cancel">继续编辑</button><button class="primary" data-dialog="reset">退出并重置</button></div>');}
  dialog.addEventListener('click',function(e){var a=e.target.dataset.dialog;if(a==='cancel')closeDialog();if(a==='reset')location.reload();if(a==='submit'){openDialog('<div class="success-mark"><img alt="" aria-hidden="true" src="data:image/svg+xml;base64,PHN2ZwogIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIKICB3aWR0aD0iMjQiCiAgaGVpZ2h0PSIyNCIKICB2aWV3Qm94PSIwIDAgMjQgMjQiCiAgZmlsbD0ibm9uZSIKICBzdHJva2U9IiMzOTczNjUiCiAgc3Ryb2tlLXdpZHRoPSIyIgogIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIKICBzdHJva2UtbGluZWpvaW49InJvdW5kIgogIGNsYXNzPSJpY29uIGljb24tdGFibGVyIGljb25zLXRhYmxlci1vdXRsaW5lIGljb24tdGFibGVyLWNoZWNrIgo+CiAgPHBhdGggc3Ryb2tlPSJub25lIiBkPSJNMCAwaDI0djI0SDB6IiBmaWxsPSJub25lIi8+CiAgPHBhdGggZD0iTTUgMTJsNSA1bDEwIC0xMCIgLz4KPC9zdmc+"></div><h2>退款信息已确认</h2><p class="dialog-sub">演示流程已完成，未发起真实退款。</p><div class="dialog-actions"><button class="primary" data-dialog="cancel">返回明细</button></div>');}if(e.target===dialog){var r=dialog.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)closeDialog();}});
  dialog.addEventListener('cancel',function(){setTimeout(function(){if(previousFocus)previousFocus.focus();},0);});
  $('#copyOrder').onclick=async function(){try{await navigator.clipboard.writeText(ORDER.no);toast('订单编号已复制');}catch(e){toast('订单编号：'+ORDER.no);}};
  /* 启动 */
  var on = document.getElementById('orderNo');
  if(on) on.textContent = ORDER.no;
  render();
})();
</script>
</body>
</html>
