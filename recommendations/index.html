 case 'filterStores':openSelector('stores','filter');break;

 case 'resetFilter':m.draft={status:'all',categories:[],stores:[]};renderModal();break;
 case 'applyFilter':state.filters={status:m.draft.status,categories:unique(m.draft.categories.filter(id=>LEAFMAP[id])),stores:validStoreIds(m.draft.stores)};state.selected=[];clearModals();render();break;
 case 'closeModal':closeModal();break;
 case 'selectorAll':m.ids=[...selectorIds(m)];renderModal();break;
 case 'selectorToggleAll':{const ids=selectorIds(m);m.ids=ids.every(id=>m.ids.includes(id))?[]:[...ids];renderModal();break;}
 case 'selectorGroup':{const ids=m.type==='categories'?CATEGORIES.find(g=>g.id===id).children.map(c=>c.id):allowedStores.filter(s=>s.region===id).map(s=>s.id);m.ids=toggleBatch(m.ids,ids);renderModal();break;}
 case 'selectorItem':if(selectorIds(m).includes(id))toggle(m.ids,id);renderModal();break;
 case 'confirmSelector':if(m.type==='categories')filterDraft().categories=m.ids.filter(id=>LEAFMAP[id]);else if(m.owner==='filter')filterDraft().stores=validStoreIds(m.ids);else{state.add.stores=validStoreIds(m.ids);delete state.add.errors.stores;}closeModal();if(state.page==='add'&&!topModal())render();break;
 case 'selectRecord':{const r=records.find(r=>r.id===id&&storeIds.includes(r.sid));if(r?.status==='visible')toggle(state.selected,id);render();break;}
 case 'selectAllRecords':{const ids=visibleRecords().filter(r=>r.status==='visible').map(r=>r.id);state.selected=ids.length&&ids.every(x=>state.selected.includes(x))?[]:ids;render();break;}
 case 'removeOne':removeRequest([id]);break;
 case 'removeSelected':removeRequest(state.selected);break;
 case 'confirmRemove':{for(const r of records)if(m.ids.includes(r.id)&&storeIds.includes(r.sid))r.status='removed';const ok=persist();state.selected=[];clearModals();render();toast(ok?'已移除推荐商品':'已移除，但当前浏览器无法保存');break;}
 case 'pin':if(b.dataset.kind==='record'&&!records.some(r=>r.id===id&&storeIds.includes(r.sid)&&r.status==='visible'))return;reorder(b.dataset.kind,id,1);if(b.dataset.kind==='record'){const ok=persist();toast(ok?'已置顶':'已置顶，但当前浏览器无法保存');}render();break;
 case 'sort':requestSort(b.dataset.kind,id);break;
 case 'sortStep':{const current=Number($('#sortValue').value)||1;m.value=Math.max(1,Math.min(m.max,current+Number(value)));$('#sortValue').value=m.value;break;}
 case 'applySort':{const n=Number($('#sortValue').value);if(!Number.isInteger(n)||n<1||n>m.max){$('#sortError').textContent='请输入 1 至 '+m.max+' 的整数';$('#sortValue').focus();break;}reorder(m.kind,m.id,n);const ok=m.kind==='record'?persist():true;closeModal();render();toast(ok?'排序已更新':'排序已更新，但当前浏览器无法保存');break;}

document.addEventListener('click',event=>{if(event.target.matches('[data-backdrop]')){closeModal();return;}const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const attrs=['data-action','data-id','data-value','data-kind','data-key'].filter(name=>b.hasAttribute(name)).map(name=>'['+name+'="'+CSS.escape(b.getAttribute(name))+'"]').join('');const wasModal=!!b.closest('#overlayHost');handleAction(b.dataset.action,b);setTimeout(()=>{const root=wasModal?$('#overlayHost'):$('#app');if(!wasModal&&$('#app').inert)return;const next=root.querySelector('button'+attrs);if(next&&next!==b&&!next.disabled)next.focus({preventScroll:true});},0);});
let composingSearch=false;
document.addEventListener('compositionstart',event=>{if(['listSearch','productSearch','storeSearch'].includes(event.target.id))composingSearch=true;});
document.addEventListener('compositionend',event=>{if(['listSearch','productSearch','storeSearch'].includes(event.target.id)){composingSearch=false;event.target.dispatchEvent(new Event('input',{bubbles:true}));}});
document.addEventListener('input',event=>{const e=event.target;if(!['listSearch','productSearch','storeSearch'].includes(e.id))return;if(event.isComposing||composingSearch)return;const start=e.selectionStart,value=e.value;if(e.id==='listSearch'){state.keyword=value;state.selected=[];render();}else if(e.id==='productSearch'){state.picker.keyword=value;render();}else{topModal().keyword=value;renderModal();}const next=$('#'+e.id);next.focus({preventScroll:true});next.setSelectionRange?.(start,start);});
document.addEventListener('keydown',event=>{const m=topModal();if(!m)return;if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Enter'&&m.type==='sort'&&event.target.id==='sortValue'){event.preventDefault();handleAction('applySort',event.target);return;}if(event.key==='Tab'){const elements=[...$('#overlayHost').querySelectorAll('button,input,[tabindex="0"]')].filter(e=>!e.disabled&&e.getClientRects().length),first=elements[0],last=elements[elements.length-1];if(event.shiftKey&&(document.activeElement===first||!$('#overlayHost').contains(document.activeElement))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&(document.activeElement===last||!$('#overlayHost').contains(document.activeElement))){event.preventDefault();first?.focus();}}});
window.addEventListener('popstate',()=>{clearModals();state.page=pageFromLocation();if(state.page==='add'&&!state.add)state.add={stores:[],products:[],errors:{}};if(state.page==='picker'){if(!state.add)state.add={stores:[],products:[],errors:{}};state.picker.selected=[...state.add.products];}render();});
