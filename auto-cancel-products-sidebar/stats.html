function today(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>parts.find(p=>p.type===k).value).join('-');}

function emptyMarkup(detail){const future=FIXTURE_DATE<state.start||FIXTURE_DATE>state.end;return '<div class="empty"><div class="empty-icon">'+icon(future?'calendar':'search')+'</div><h3>'+(future?'该时间范围暂无商品数据':detail?'未找到匹配门店或商品':'当前筛选范围暂无商品数据')+'</h3><p>'+(future?(state.start===state.end?state.start:state.start+' 至 '+state.end)+' 暂无可展示记录<br>可返回首页调整日期或组织':'试试其他门店名称、商品名称或编码')+'</p>'+(!future&&detail?'<button type="button" data-empty="search">清空搜索</button>':!detail&&future?'<button type="button" data-empty="today">返回今日</button>':'')+'</div>';}
function storeMarkup(s){return '<article class="store-card"><header class="store-header"><span class="store-icon">'+icon('building-store')+'</span><div class="selected-store-meta"><h4 class="store-name">'+esc(s.name)+'</h4><span class="selected-store-count">商品种类数：'+s.goods.length+'</span></div></header><div class="goods-list" id="goods-'+s.id+'">'+s.goods.map((p,i)=>'<div class="goods-row"><span class="goods-index">'+(i+1)+'</span><div class="goods-info"><div class="goods-name"><span>'+esc(p.name)+'</span><span class="goods-chevron" aria-hidden="true">'+icon('chevron-right')+'</span></div><div class="goods-code">商品编码 '+esc(p.code)+'</div></div></div>').join('')+'</div></article>';}
function renderDetail(){
 const g=getRows().find(g=>g.id===state.market),stores=g?.stores||[],kinds=new Set(stores.flatMap(s=>s.goods.map(p=>p.code))).size;
 const previous=state.activeStore,navScroll=$('#storeNav').scrollTop;
 if(!stores.some(s=>s.id===state.activeStore))state.activeStore=stores[0]?.id||null;
 const selected=stores.find(s=>s.id===state.activeStore);
 $('#detailDate').textContent=state.start===state.end?state.start:state.start+' 至 '+state.end;
 $('#detailCounts').textContent='关联门店：'+stores.length+'家 I 商品种类数：'+kinds;
 $('#storeNav').innerHTML=stores.length?stores.map(s=>'<button type="button" class="store-tab'+(s.id===state.activeStore?' active':'')+'" data-store-tab="'+s.id+'" aria-pressed="'+(s.id===state.activeStore)+'" aria-controls="detailList"><span>'+esc(s.name)+'</span><small>商品种类数：'+s.goods.length+'</small></button>').join(''):'<p class="sidebar-empty">暂无门店</p>';
 $('#storeNav').scrollTop=navScroll;
 $('#detailList').innerHTML=selected?storeMarkup(selected):emptyMarkup(true);
 $('#detailEnd').textContent=selected?'已展示该门店全部商品':'';
 if(previous!==state.activeStore)$('#productPanel').scrollTop=0;
}
$('#storeNav').onclick=e=>{const b=e.target.closest('[data-store-tab]');if(!b)return;state.activeStore=b.dataset.storeTab;renderDetail();$('#productPanel').scrollTop=0;document.querySelector('[data-store-tab="'+state.activeStore+'"]').focus({preventScroll:true});};
let homeScroll=0;
function syncRoute(){const previous=state.market,match=location.hash.match(/^#market-(g\d+)$/),id=match&&GROUPS.some(g=>g.id===match[1])?match[1]:null;state.page=id?'detail':'home';state.market=id;if(previous!==id)state.activeStore=null;state.keyword='';$('#searchInput').value='';state.expanded.clear();render();$('#pageScroll').scrollTop=id?0:homeScroll;if(id)$('#navBack').focus({preventScroll:true});else if(previous)document.querySelector('[data-market="'+previous+'"]')?.focus({preventScroll:true});}
function openMarket(id){if(!getRows('').some(g=>g.id===id))return;homeScroll=$('#pageScroll').scrollTop;history.pushState({autoCancelMarket:id},'','#market-'+id);syncRoute();}
function returnHome(){if(history.state?.autoCancelMarket===state.market){history.back();}else{history.replaceState(null,'',location.pathname+location.search);syncRoute();}}
window.addEventListener('popstate',syncRoute);
$('#navBack').onclick=e=>{if(state.page==='detail'){e.preventDefault();returnHome();}};
function rangeError(start,end){if(!isDate(start)||!isDate(end))return '请选择开始和结束日期';if(start<today()||end<today())return '不可选择今日之前的日期';if(start>end)return '开始日期不可晚于结束日期';return '';}
function chooseRange(start,end){if(rangeError(start,end))return false;state.start=start;state.end=end;state.expanded.clear();render();$('#pageScroll').scrollTop=0;return true;}
function chooseDate(value){return chooseRange(value,value);}
function openSheet(next){mode=next;returnFocus=document.activeElement;$('#sheet').dataset.mode=mode;$('#sheetTitle').textContent=mode==='org'?'选择组织':mode==='date'?'选择日期区间':'统计说明';$('#sheetFooter').hidden=false;$('#selectionCount').hidden=mode!=='org';$('#resetSheet').hidden=mode==='info';$('#confirmSheet').textContent=mode==='info'?'我知道了':'确定';$('#confirmSheet').disabled=false;draft=mode==='org'?[...state.storeIds]:{start:state.start,end:state.end};$('#sheetBody').scrollTop=0;if(mode==='org'){activeGroup=GROUPS.find(g=>g.stores.some(s=>draft.includes(s.id)))?.id||GROUPS[0].id;renderOrg();}else if(mode==='date'){if(draft.start<today())draft.start=today();if(draft.end<draft.start)draft.end=draft.start;month=draft.start.slice(0,7);rangePicking='start';renderCalendar();}else renderInfo();$('#backdrop').hidden=false;$('#sheet').hidden=false;$('#appContent').inert=true;clearTimeout(animationTimer);$('#sheet').classList.add('enter');animationTimer=setTimeout(()=>$('#sheet').classList.remove('enter'),250);$('#closeSheet').focus({preventScroll:true});}
function closeSheet(){clearTimeout(animationTimer);$('#sheet').classList.remove('enter');$('#sheet').hidden=true;$('#backdrop').hidden=true;$('#appContent').inert=false;mode='';draft=null;if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
function renderOrg(focus=''){const oldLeft=$('.org-groups')?.scrollTop||0,oldRight=$('.org-stores')?.scrollTop||0;const selected=new Set(draft),active=GROUPS.find(g=>g.id===activeGroup);$('#sheetBody').innerHTML='<label class="org-all"><span>全部组织<small>共 '+STORE_IDS.length+' 家门店</small></span><input type="checkbox" id="allStores" aria-label="全选所有组织和门店" '+(selected.size===STORE_IDS.length?'checked':'')+'></label><div class="org-columns"><div class="org-groups" role="group" aria-label="组织列表">'+GROUPS.map(g=>{const n=g.stores.filter(s=>selected.has(s.id)).length;return '<div class="org-group'+(g.id===activeGroup?' current':'')+'"><input type="checkbox" data-group-check="'+g.id+'" aria-label="全选'+esc(g.name)+'下的门店" '+(n===g.stores.length?'checked':'')+'><button type="button" data-group-open="'+g.id+'" aria-pressed="'+(g.id===activeGroup)+'" aria-controls="orgStores">'+esc(g.name)+'<small>'+n+'/'+g.stores.length+' 家门店</small></button></div>';}).join('')+'</div><div class="org-stores" id="orgStores" role="group" aria-label="'+esc(active.name)+'门店"><div class="org-store-heading">'+esc(active.name)+' · '+active.stores.length+' 家门店</div>'+active.stores.map(s=>'<label class="org-store"><span>'+esc(s.name)+'</span><input type="checkbox" data-store-check="'+s.id+'" '+(selected.has(s.id)?'checked':'')+'></label>').join('')+'</div></div>';
$('#selectionCount').textContent='已选：'+selected.size+' 家门店';$('#confirmSheet').disabled=!selected.size;$('#allStores').indeterminate=selected.size>0&&selected.size<STORE_IDS.length;$('#allStores').onchange=e=>{draft=e.target.checked?[...STORE_IDS]:[];renderOrg('#allStores');};document.querySelectorAll('[data-group-check]').forEach(el=>{const g=GROUPS.find(g=>g.id===el.dataset.groupCheck),ids=g.stores.map(s=>s.id),n=ids.filter(id=>selected.has(id)).length;el.indeterminate=n>0&&n<ids.length;el.onchange=()=>{draft=el.checked?[...new Set([...draft,...ids])]:draft.filter(id=>!ids.includes(id));renderOrg('[data-group-check="'+g.id+'"]');};});document.querySelectorAll('[data-group-open]').forEach(el=>el.onclick=()=>{activeGroup=el.dataset.groupOpen;renderOrg('[data-group-open="'+activeGroup+'"]');$('.org-stores').scrollTop=0;});document.querySelectorAll('[data-store-check]').forEach(el=>el.onchange=()=>{const id=el.dataset.storeCheck;draft=el.checked?[...new Set([...draft,id])]:draft.filter(x=>x!==id);renderOrg('[data-store-check="'+id+'"]');});$('.org-groups').scrollTop=oldLeft;$('.org-stores').scrollTop=oldRight;if(focus)$(focus)?.focus({preventScroll:true});}
function presetRange(key){const start=key==='tomorrow'?addDays(today(),1):today();return {start,end:key==='week'?addDays(start,6):start};}
function renderCalendar(focus=''){
  const [y,m]=month.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1,12)),offset=first.getUTCDay(),start=addDays(month+'-01',-offset),min=today();
  $('#sheetBody').innerHTML='<div class="calendar-top"><div class="calendar-nav"><button type="button" id="prevMonth" aria-label="上个月" '+(month<=min.slice(0,7)?'disabled':'')+'>'+icon('chevron-left')+'</button><strong>'+y+'年'+m+'月</strong><button type="button" id="nextMonth" aria-label="下个月">'+icon('chevron-right')+'</button></div><div class="calendar-presets" role="group" aria-label="快捷日期">'+[{key:'today',label:'今日'},{key:'tomorrow',label:'明日'},{key:'week',label:'近一周'}].map(p=>{const r=presetRange(p.key),on=draft.start===r.start&&draft.end===r.end;return '<button type="button" data-date-preset="'+p.key+'" class="'+(on?'active':'')+'" aria-pressed="'+on+'">'+p.label+'</button>';}).join('')+'</div></div><div class="weekdays" aria-hidden="true">'+['日','一','二','三','四','五','六'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="calendar-grid" role="group" aria-label="日期区间">'+Array.from({length:42},(_,i)=>{
    const d=addDays(start,i),isStart=d===draft.start,isEnd=d===draft.end,inside=d>draft.start&&d<draft.end;
    return '<button class="calendar-day'+(d.slice(0,7)!==month?' outside':'')+(d===min?' today':'')+(isStart||isEnd?' selected':'')+(inside?' in-range':'')+(isStart?' range-start':'')+(isEnd?' range-end':'')+'" type="button" data-day="'+d+'" aria-label="'+d+(isStart?'，开始日期':'')+(isEnd?'，结束日期':'')+'" aria-pressed="'+(isStart||isEnd||inside)+'" '+(d<min?'disabled':'')+'><span>'+Number(d.slice(-2))+'</span></button>';
  }).join('')+'</div><p class="calendar-hint">先选开始日期，再选结束日期；仅可选择今日及以后的日期，支持单日查询。</p><p class="form-error" id="dateError" role="alert">'+rangeError(draft.start,draft.end)+'</p>';
  $('#prevMonth').onclick=()=>{if(month<=today().slice(0,7))return;month=new Date(Date.UTC(y,m-2,1,12)).toISOString().slice(0,7);renderCalendar('#prevMonth');};
  $('#nextMonth').onclick=()=>{month=new Date(Date.UTC(y,m,1,12)).toISOString().slice(0,7);renderCalendar('#nextMonth');};
  document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{const d=el.dataset.day;if(d<today())return;if(rangePicking==='start'||!isDate(draft.start)){draft={start:d,end:d};rangePicking='end';}else{draft=d<draft.start?{start:d,end:draft.start}:{start:draft.start,end:d};rangePicking='start';}renderCalendar('[data-day="'+d+'"]');});
  document.querySelectorAll('[data-date-preset]').forEach(el=>el.onclick=()=>{draft=presetRange(el.dataset.datePreset);month=draft.start.slice(0,7);rangePicking='start';renderCalendar('[data-date-preset="'+el.dataset.datePreset+'"]');});
  if(focus)$(focus)?.focus({preventScroll:true});
}
function renderInfo(){$('#sheetBody').innerHTML='<div class="info-content"><h3>展示内容</h3><p>按日期区间与关联组织，查看各门店超时自动退单的商品名称、编码及种类数；<br>选择多个门店组织时，统计结果为去重后的商品种类数。</p><h3>日期范围</h3><p>默认今日，支持日期区间选择；<br>仅支持今日及未来日期。</p></div>';}
$('#orgButton').onclick=()=>openSheet('org');$('#dateButton').onclick=()=>openSheet('date');$('#infoButton').onclick=()=>openSheet('info');$('#searchInput').oninput=e=>{state.keyword=e.target.value;render();};$('#clearSearch').onclick=()=>{state.keyword='';$('#searchInput').value='';render();$('#searchInput').focus();};$('#closeSheet').onclick=closeSheet;$('#backdrop').onclick=closeSheet;
$('#resetSheet').onclick=()=>{if(mode==='org'){draft=[];renderOrg();}else if(mode==='date'){draft={start:today(),end:today()};month=draft.start.slice(0,7);rangePicking='start';renderCalendar();}};
$('#confirmSheet').onclick=()=>{if(mode==='org'){if(!draft.length)return;state.storeIds=[...draft];closeSheet();render();$('#pageScroll').scrollTop=0;}else if(mode==='date'){const {start,end}=draft,error=rangeError(start,end);if(error){$('#dateError').textContent=error;return;}if(!chooseRange(start,end))return;closeSheet();}else closeSheet();};
$('#resultList').onclick=e=>{const market=e.target.closest('[data-market]');if(market){openMarket(market.dataset.market);return;}if(e.target.closest('[data-empty="today"]'))chooseDate(today());};
$('#detailList').onclick=e=>{const b=e.target.closest('[data-expand]');if(b){const id=b.dataset.expand;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);renderDetail();document.querySelector('[data-expand="'+id+'"]')?.focus({preventScroll:true});}if(e.target.closest('[data-empty="search"]')){state.keyword='';$('#searchInput').value='';renderDetail();$('#clearSearch').hidden=true;}};
document.addEventListener('keydown',e=>{if($('#sheet').hidden){if(e.key==='Escape'&&state.page==='detail'){e.preventDefault();returnHome();}return;}if(e.key==='Escape'){e.preventDefault();closeSheet();return;}if(e.key==='Tab'){const items=[...$('#sheet').querySelectorAll('button,input,a,[tabindex="0"]')].filter(el=>!el.disabled&&el.getClientRects().length),first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||!$('#sheet').contains(document.activeElement))){e.preventDefault();last?.focus();}else if(!e.shiftKey&&(document.activeElement===last||!$('#sheet').contains(document.activeElement))){e.preventDefault();first?.focus();}}});
window.AutoCancelDemo={state,today,fixtureDate:FIXTURE_DATE,chooseDate,chooseRange,getRows,openMarket};hydrate();syncRoute();
</script></body></html>
